# Render Blueprint - deploys the FastAPI backend as a free Web Service.
#
# Usage: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file, provisions the service, and prompts for the "sync: false" env
# vars below (DATABASE_URL, SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD) since
# those are secrets/instance-specific and deliberately not committed here.
#
# Database is NOT defined here - Render's free Postgres expires after 30
# days, so this pilot setup points DATABASE_URL at a free Neon Postgres
# project instead (see backend/README.md "Deploying a pilot instance"). Use
# Neon's DIRECT connection string (no "-pooler" in the hostname) rewritten
# for asyncpg, e.g.:
#   postgresql+asyncpg://user:pass@ep-xxxx.region.aws.neon.tech/dbname?ssl=require
# Neon's pooled endpoint uses PgBouncer transaction pooling, which conflicts
# with asyncpg's prepared-statement caching (intermittent
# DuplicatePreparedStatementError) - the direct endpoint sidesteps that
# entirely at this pilot's connection volume, no code change needed.
#
# dockerCommand overrides the Dockerfile's CMD (Render-blueprint-only, the
# Dockerfile itself is untouched) to run alembic migrations + the idempotent
# admin-seed script before uvicorn starts - the free plan doesn't support
# preDeployCommand, so this runs on every container start instead of once
# per deploy. Both steps are safe to repeat (alembic no-ops once at head,
# seed_admin skips if the admin already exists), which is what makes this OK
# even though it fires on every free-tier spin-up after idling.
#
# It points at backend/render-start.sh rather than inlining "a && b && c"
# here because Render's dockerCommand does a plain whitespace split with NO
# shell interpretation - a one-line chained command gets torn into literal
# argv elements (alembic ends up receiving "&&" as one of its own CLI args).
# Two space-free tokens ("sh render-start.sh") survive that split intact,
# and the chaining happens inside the script instead, where a real shell
# parses it.
services:
  - type: web
    name: employee-agent-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    dockerCommand: sh render-start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_DOMAIN
        value: ""
      - key: CORS_ORIGINS
        value: '["http://localhost:5173"]'
      - key: AGGREGATION_INTERVAL_MINUTES
        value: "15"
      - key: ALERT_EVALUATION_INTERVAL_MINUTES
        value: "5"
      - key: ENVIRONMENT
        value: production
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_FULL_NAME
        value: "Admin User"
